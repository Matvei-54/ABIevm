services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: abievm
      POSTGRES_USER: abievm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - abievm_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abievm -d abievm"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  abievm_postgres:
