definitions:
  dto.ConvexPlacement:
    properties:
      address:
        type: string
      pid:
        type: string
      rewardPool:
        type: string
    type: object
  dto.ConvexRateDiagnostic:
    properties:
      expectedCrvRateRaw:
        type: string
      helperCrvRateRaw:
        type: string
      helperOwnSidecarRate:
        type: string
      message:
        type: string
      ownSidecarRate:
        type: string
      periodFinish:
        type: integer
      pid:
        type: string
      rewardPool:
        type: string
      rewardRateRaw:
        type: string
      roundingDifference:
        type: string
      sidecarBalanceRaw:
        type: string
      slots:
        description: This helper rate is raw reward units per 1e18 raw LP units per
          second.
        items:
          $ref: '#/definitions/dto.ConvexRewardSlot'
        type: array
      stakedSupplyRaw:
        type: string
      status:
        type: string
      utility:
        type: string
    type: object
  dto.ConvexRewardSlot:
    properties:
      rateRaw:
        type: string
      source:
        type: string
      token:
        type: string
    type: object
  dto.LockerRateDiagnostic:
    properties:
      inflationRaw:
        type: string
      killed:
        type: boolean
      relativeWeightRaw:
        type: string
      workingBalanceRaw:
        type: string
      workingSupplyRaw:
        type: string
    type: object
  dto.PriceDiagnostic:
    properties:
      blockNumber:
        type: integer
      components:
        items:
          type: string
        type: array
      source:
        type: string
      sourceContract:
        type: string
      token:
        type: string
      updatedAt:
        type: string
      usd:
        type: string
      validUntil:
        type: string
    type: object
  dto.PrimaryRateDiagnostic:
    properties:
      convexGrossRate:
        type: string
      harvestFeeFraction:
        type: string
      harvestFeeRate:
        type: string
      locker:
        type: string
      lockerGrossRate:
        type: string
      lockerInputs:
        $ref: '#/definitions/dto.LockerRateDiagnostic'
      netRate:
        type: string
      protocolFeeFraction:
        type: string
      protocolFeeRate:
        type: string
      sidecars:
        items:
          $ref: '#/definitions/dto.ConvexPlacement'
        type: array
      unit:
        type: string
    type: object
  dto.ReaderModelDiagnostic:
    properties:
      actualCrvApr:
        type: number
      cappedReferenceSidecarCrvRate:
        type: string
      differencePercentagePoints:
        type: number
      globalPoolCrvRate:
        type: string
      globalProtocolFeeApr:
        type: number
      grossMinApr:
        type: number
      message:
        type: string
      ownSidecarCrvRate:
        type: string
      referenceApr:
        type: number
      scope:
        type: string
      source:
        type: string
      status:
        type: string
      weightedBoost:
        type: number
      withoutHarvestFeeApr:
        type: number
    type: object
  dto.StakeDAOAllocation:
    properties:
      accountedAssets:
        type: string
      physicalAssets:
        type: string
      status:
        description: covered, surplus, deficit, unverified
        type: string
      surplusAssets:
        type: string
    type: object
  dto.StakeDAOPool:
    properties:
      accountantAddress:
        type: string
      allocation:
        $ref: '#/definitions/dto.StakeDAOAllocation'
      apr:
        type: number
      aprScope:
        type: string
      aprStatus:
        type: string
      apy:
        type: number
      assetAddress:
        type: string
      assetAmount:
        description: AssetAmount is an exact decimal quantity of the underlying token,
          not USD TVL.
        type: string
      assetDecimals:
        type: integer
      assetSymbol:
        type: string
      diagnostics:
        $ref: '#/definitions/dto.StakeDAOPoolDiagnostics'
      gaugeAddress:
        type: string
      name:
        type: string
      protocolId:
        type: string
      rewardMechanism:
        type: string
      rewardReceiver:
        type: string
      rewardToken:
        type: string
      rewards:
        items:
          $ref: '#/definitions/dto.StakeDAOReward'
        type: array
      source:
        description: ChainID     int64          `json:"chainId"`
        type: string
      symbol:
        type: string
      tvl:
        type: number
      updatedAt:
        type: string
      vaultAddress:
        type: string
    type: object
  dto.StakeDAOPoolDiagnostics:
    properties:
      convex:
        $ref: '#/definitions/dto.ConvexRateDiagnostic'
      prices:
        items:
          $ref: '#/definitions/dto.PriceDiagnostic'
        type: array
      primary:
        $ref: '#/definitions/dto.PrimaryRateDiagnostic'
      readerModel:
        $ref: '#/definitions/dto.ReaderModelDiagnostic'
    type: object
  dto.StakeDAOPoolError:
    properties:
      code:
        type: string
      contract:
        type: string
      field:
        type: string
      gaugeAddress:
        type: string
      message:
        type: string
      method:
        type: string
      stage:
        type: string
    type: object
  dto.StakeDAOPoolSummary:
    properties:
      address:
        type: string
      apr:
        type: number
      apy:
        type: number
      name:
        type: string
      status:
        type: string
      symbol:
        type: string
    type: object
  dto.StakeDAOPoolsResponse:
    properties:
      blockHash:
        type: string
      blockNumber:
        type: integer
      blockTimestamp:
        type: integer
      errors:
        items:
          $ref: '#/definitions/dto.StakeDAOPoolError'
        type: array
      network:
        type: string
      pools:
        items:
          $ref: '#/definitions/dto.StakeDAOPool'
        type: array
      rpcAttempts:
        type: integer
      strictPrices:
        type: boolean
    type: object
  dto.StakeDAOPoolsSummaryResponse:
    properties:
      blockNumber:
        type: integer
      network:
        type: string
      pools:
        items:
          $ref: '#/definitions/dto.StakeDAOPoolSummary'
        type: array
    type: object
  dto.StakeDAOReward:
    properties:
      apr:
        type: number
      distributionStatus:
        description: Extra rewards describe the vault's actual distribution, not a
          projected mint.
        type: string
      periodFinish:
        type: integer
      ratePerSecond:
        type: string
      source:
        type: string
      token:
        type: string
    type: object
info:
  contact: {}
paths:
  /reservesAave/{network}:
    get:
      consumes:
      - application/json
      description: Возвращает полный список резервов с параметрами (LTV, ликвидность,
        цены и т.д.)
      parameters:
      - description: 'Название сети: ethereum | arbitrum | polygon | optimism | base'
        in: path
        name: network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить данные всех резервов Aave V3
      tags:
      - Aave V3
  /reservesCurve/{network}:
    get:
      consumes:
      - application/json
      description: Возвращает полный список резервов с параметрами (LTV, ликвидность,
        цены и т.д.)
      parameters:
      - description: 'Название сети: ethereum | arbitrum | polygon | optimism | base'
        in: path
        name: network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema: {}
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить данные всех резервов Curve V3
      tags:
      - Curve V3
  /reservesStakedao/{network}:
    get:
      consumes:
      - application/json
      description: 'По умолчанию: name, apr, symbol, address (vault), apy, status
        (полнота APR). details=true возвращает TVL, адреса контрактов, награды и диагностику.
        APR в процентах; APY пока недоступен.'
      parameters:
      - description: 'Поддерживаемая сеть: ethereum'
        in: path
        name: network
        required: true
        type: string
      - default: false
        description: Полный ответ с контрактами, TVL и диагностикой
        in: query
        name: details
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StakeDAOPoolsSummaryResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить пулы StakeDAO из блокчейна
      tags:
      - StakeDao
  /reservesStakedao/{network}/diagnostics:
    get:
      description: Два или пять выбранных gauge через текущий Controller, без истории
        и Postgres. Состав APR, происхождение цен и контроль Convex PoolUtilities.
        Не более 5 RPC/с и 300 попыток на запрос.
      parameters:
      - description: 'Поддерживаемая сеть: ethereum'
        in: path
        name: network
        required: true
        type: string
      - default: 2
        description: Количество контрольных пулов
        enum:
        - 2
        - 5
        in: query
        name: limit
        type: integer
      - description: Десятичный номер блока; включает строгие цены этого блока
        in: query
        name: block
        type: string
      - default: false
        description: Изолированные цены выбранного блока без общего кэша
        in: query
        name: strictPrices
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.StakeDAOPoolsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
        "504":
          description: Gateway Timeout
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Проверить награды crvUSD/USDC и FXS/ETH
      tags:
      - StakeDao
swagger: "2.0"
